<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fleet Maintenance">
<meta name="theme-color" content="#1A2744">
<title>Fleet Maintenance Manager</title>
<style>
:root {
  --navy:#1A2744;--blue:#2E4A7A;--accent:#4472C4;
  --red:#C00000;--amber:#E07B00;--green:#215732;
  --bg:#F4F5F7;--surface:#FFFFFF;--surface2:#F0F2F5;
  --border:rgba(0,0,0,0.12);--text:#1A1A1A;--text2:#5A5A6A;--text3:#9A9AAA;
  --diesel:#FFF9C4;--gas:#E8F5E9;--small:#FFCCBC;--natgas:#E3F2FD;
  --radius:12px;--radius-sm:8px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-top:env(safe-area-inset-top,0px);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0F1117;--surface:#1C1F2A;--surface2:#252838;
    --border:rgba(255,255,255,0.10);--text:#F0F0F8;--text2:#9898B0;--text3:#5A5A70;
    --diesel:#3A3510;--gas:#0F2A14;--small:#3A1A08;--natgas:#0A1F3A;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}
#app{display:flex;flex-direction:column;height:100%;padding-top:var(--safe-top)}

/* HEADER */
.hdr{background:var(--navy);padding:12px 16px 10px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
.hdr-title{font-size:18px;font-weight:700;color:#fff;letter-spacing:-.3px}
.hdr-sub{font-size:11px;color:rgba(255,255,255,.6);margin-top:1px}
.hdr-btns{display:flex;gap:8px}
.hdr-btn{background:rgba(255,255,255,.12);border:none;border-radius:var(--radius-sm);padding:7px 12px;font-size:12px;font-weight:600;color:#fff;cursor:pointer;white-space:nowrap}
.hdr-btn:active{opacity:.7}
.hdr-btn.accent{background:var(--accent)}

/* TABS */
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:80px;padding:10px 8px;font-size:12px;font-weight:600;color:var(--text2);text-align:center;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab.active{color:var(--navy);border-bottom-color:var(--navy)}
@media(prefers-color-scheme:dark){.tab.active{color:var(--accent);border-bottom-color:var(--accent)}}

/* SUMMARY STRIP */
.summary{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;flex-shrink:0;scrollbar-width:none;background:var(--bg)}
.summary::-webkit-scrollbar{display:none}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:5px 14px;white-space:nowrap;flex-shrink:0;text-align:center}
.stat .v{font-size:16px;font-weight:700;line-height:1.1}
.stat .l{font-size:10px;color:var(--text2)}
.stat.red .v{color:var(--red)}
.stat.amber .v{color:var(--amber)}
.stat.green .v{color:var(--green)}

/* SEARCH */
.search-bar{margin:0 16px 10px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px}
.search-bar input{flex:1;background:none;border:none;font-size:14px;color:var(--text);outline:none}
.search-bar svg{flex-shrink:0;color:var(--text3)}

/* SCROLL AREA */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 120px}

/* VEHICLE CARD */
.vcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer}
.vcard:active{opacity:.85}
.vcard-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.vcard-name{font-size:14px;font-weight:700;line-height:1.3;flex:1}
.vcard-serial{font-size:10px;color:var(--text2);font-family:monospace;margin-top:2px}
.vcard-badges{display:flex;flex-direction:column;align-items:flex-end;gap:4px;margin-left:8px;flex-shrink:0}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.b-diesel{background:var(--diesel);color:#5A4800}
.b-gas{background:var(--gas);color:#1B4D1E}
.b-small{background:var(--small);color:#6D2A00}
.b-natgas{background:var(--natgas);color:#0D3A6A}
.b-ok{background:#E8F5E9;color:var(--green)}
.b-due{background:#FFF3E0;color:var(--amber)}
.b-over{background:#FFEBEE;color:var(--red)}
.b-na{background:var(--surface2);color:var(--text3)}
.vcard-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.vf label{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3)}
.vf span{font-size:12px;color:var(--text);display:block;margin-top:1px}
.vcard-hr{height:1px;background:var(--border);margin:10px 0}
.vcard-actions{display:flex;gap:8px}
.va-btn{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 4px;font-size:11px;font-weight:600;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.va-btn:active{opacity:.7}
.va-btn.primary{background:var(--navy);color:#fff;border-color:transparent}
.va-btn.danger{background:#FFEBEE;color:var(--red);border-color:transparent}

/* LOG CARDS */
.log-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px}
.log-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.log-vehicle{font-size:13px;font-weight:700}
.log-date{font-size:11px;color:var(--text2)}
.log-type{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:4px}
.log-detail{font-size:11px;color:var(--text2);line-height:1.5}
.log-cost{font-size:12px;font-weight:600;color:var(--green);margin-top:4px}
.log-tech{font-size:10px;color:var(--text3);margin-top:2px}

/* BOTTOM SHEET */
.sheet-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60}
.sheet-bg.open{display:block}
.sheet{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-radius:20px 20px 0 0;z-index:61;max-height:94vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1)}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 0}
.sheet-hdr{padding:12px 20px 8px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:1px solid var(--border)}
.sheet-title{font-size:16px;font-weight:700}
.sheet-close{width:28px;height:28px;border-radius:14px;background:var(--surface2);border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 20px 20px;flex:1}

/* DETAIL SHEET */
.detail-section{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.detail-section:first-child{margin-top:0}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.detail-field{background:var(--surface2);border-radius:var(--radius-sm);padding:10px 12px}
.detail-field label{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);display:block;margin-bottom:3px}
.detail-field span{font-size:12px;color:var(--text);font-weight:500}
.detail-field.full{grid-column:1/-1}
.detail-field.warn span{color:var(--red);font-weight:700}
.detail-field.ok span{color:var(--green)}
.hrs-input{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:15px;color:var(--text);font-family:inherit;-webkit-appearance:none}
.hrs-input:focus{outline:none;border-color:var(--accent)}
.prog-bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin:4px 0 8px}
.prog-fill{height:100%;border-radius:4px;transition:width .3s}

/* FORM */
.form-section{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin:14px 0 8px}
.form-section:first-child{margin-top:0}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;font-size:15px;color:var(--text);font-family:inherit;-webkit-appearance:none;appearance:none}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field textarea{resize:none;height:80px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-primary{width:100%;background:var(--navy);color:#fff;border:none;border-radius:var(--radius-sm);padding:14px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:8px}
.btn-primary:active{opacity:.8}
.btn-danger{width:100%;background:var(--red);color:#fff;border:none;border-radius:var(--radius-sm);padding:12px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:8px}

/* FAB */
.fab{position:fixed;bottom:calc(20px + var(--safe-bottom));right:20px;z-index:50;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.fab-main{width:56px;height:56px;border-radius:28px;background:var(--navy);color:#fff;border:none;font-size:26px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.fab-main:active{transform:scale(.93)}
.fab-row{display:flex;align-items:center;gap:10px}
.fab-mini{width:44px;height:44px;border-radius:22px;background:var(--surface);border:1.5px solid var(--border);color:var(--text);font-size:20px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center}
.fab-mini:active{opacity:.7}
.fab-lbl{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.12);white-space:nowrap;color:var(--text)}

/* EMPTY */
.empty{text-align:center;padding:48px 24px;color:var(--text2)}
.empty .icon{font-size:44px;display:block;margin-bottom:12px}
.empty h3{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px}
.empty p{font-size:13px;line-height:1.6}

/* TOAST */
.toast{position:fixed;top:calc(12px + var(--safe-top));left:50%;transform:translateX(-50%) translateY(-70px);background:var(--navy);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:100;transition:transform .3s;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}

/* FILTER ROW */
.filter-row{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{background:var(--surface);border:1.5px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;white-space:nowrap;flex-shrink:0}
.filter-chip.active{background:var(--navy);border-color:var(--navy);color:#fff}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div>
      <div class="hdr-title">Fleet Maintenance</div>
      <div class="hdr-sub" id="hdr-sub">Loading...</div>
    </div>
    <div class="hdr-btns">
      <button class="hdr-btn" onclick="exportCSV()">⬇ Export CSV</button>
      <button class="hdr-btn accent" onclick="openLogSheet()">+ Log Service</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="setTab('fleet',this)">Fleet</div>
    <div class="tab" onclick="setTab('schedule',this)">Schedule</div>
    <div class="tab" onclick="setTab('log',this)">Service Log</div>
    <div class="tab" onclick="setTab('parts',this)">Parts List</div>
  </div>

  <div class="summary" id="summary"></div>

  <div class="filter-row" id="filter-row" style="display:none">
    <div class="filter-chip active" onclick="setFilter('',this)">All</div>
    <div class="filter-chip" onclick="setFilter('Car/Truck',this)">Cars/Trucks</div>
    <div class="filter-chip" onclick="setFilter('UTV',this)">UTVs</div>
    <div class="filter-chip" onclick="setFilter('ATV',this)">ATVs</div>
    <div class="filter-chip" onclick="setFilter('Lawn mower',this)">Mowers</div>
    <div class="filter-chip" onclick="setFilter('Skid steer',this)">Skid Steer</div>
    <div class="filter-chip" onclick="setFilter('Tractor',this)">Tractor</div>
    <div class="filter-chip" onclick="setFilter('Generator',this)">Generator</div>
    <div class="filter-chip" onclick="setFilter('Other',this)">Other</div>
  </div>

  <div class="search-bar" id="search-bar" style="display:none">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="search-input" placeholder="Search vehicles..." oninput="render()">
  </div>

  <div class="scroll" id="scroll-area"></div>
</div>

<div class="fab" id="fab" style="display:none">
  <div class="fab-row" id="fab-export-row" style="display:none">
    <div class="fab-lbl">Export CSV</div>
    <div class="fab-mini" onclick="exportCSV()">⬇</div>
  </div>
  <div class="fab-main" id="fab-main" onclick="toggleFab()">+</div>
</div>

<div class="toast" id="toast"></div>
<div class="sheet-bg" id="sheet-bg" onclick="closeSheets()"></div>

<!-- DETAIL SHEET -->
<div class="sheet" id="detail-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-hdr">
    <div class="sheet-title" id="detail-title">Vehicle</div>
    <button class="sheet-close" onclick="closeSheets()">✕</button>
  </div>
  <div class="sheet-body" id="detail-body"></div>
</div>

<!-- UPDATE HOURS SHEET -->
<div class="sheet" id="hrs-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-hdr">
    <div class="sheet-title" id="hrs-title">Update Hours / Miles</div>
    <button class="sheet-close" onclick="closeSheets()">✕</button>
  </div>
  <div class="sheet-body">
    <div class="field">
      <label>Current Mileage or Hours</label>
      <input type="number" id="hrs-input" class="hrs-input" inputmode="numeric" min="0" placeholder="Enter current reading">
    </div>
    <div class="field">
      <label>Last Oil Change (hrs/mi)</label>
      <input type="number" id="last-oil-input" class="hrs-input" inputmode="numeric" min="0" placeholder="Enter last oil change reading">
    </div>
    <div class="field">
      <label>Last Hydraulic Fluid Change (hrs) — if applicable</label>
      <input type="number" id="last-hyd-input" class="hrs-input" inputmode="numeric" min="0" placeholder="N/A if no hydraulic system">
    </div>
    <button class="btn-primary" onclick="saveHours()">Save</button>
  </div>
</div>

<!-- LOG SERVICE SHEET -->
<div class="sheet" id="log-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-hdr">
    <div class="sheet-title">Log Service</div>
    <button class="sheet-close" onclick="closeSheets()">✕</button>
  </div>
  <div class="sheet-body">
    <div class="form-section">Vehicle & Date</div>
    <div class="field">
      <label>Vehicle *</label>
      <select id="log-vehicle"></select>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Date *</label>
        <input type="date" id="log-date">
      </div>
      <div class="field">
        <label>Hrs / Mileage</label>
        <input type="number" id="log-hrs" inputmode="numeric" placeholder="Current reading">
      </div>
    </div>
    <div class="form-section">Service Details</div>
    <div class="field">
      <label>Service Type *</label>
      <select id="log-type">
        <option>Oil Change</option>
        <option>Hydraulic Fluid Change</option>
        <option>Air Filter Replacement</option>
        <option>Cabin Filter Replacement</option>
        <option>Spark Plug Replacement</option>
        <option>Belt Replacement</option>
        <option>Fuel Filter Replacement</option>
        <option>Transmission Fluid Change</option>
        <option>Differential Fluid Change</option>
        <option>Battery Replacement</option>
        <option>Wiper Blade Replacement</option>
        <option>Tire Rotation / Replacement</option>
        <option>Full Service (Oil + Filter + Air)</option>
        <option>Hydraulic Filter Replacement</option>
        <option>Greasing / Lubrication</option>
        <option>Inspection</option>
        <option>Repair</option>
        <option>Other</option>
      </select>
    </div>
    <div class="field">
      <label>Parts Used / Part Numbers</label>
      <input type="text" id="log-parts" placeholder="e.g. ACDelco PF64, 5qt 0W-20">
    </div>
    <div class="field">
      <label>Notes / Observations</label>
      <textarea id="log-notes" placeholder="Any observations, conditions, issues found..."></textarea>
    </div>
    <div class="form-section">Technician & Cost</div>
    <div class="field-row">
      <div class="field">
        <label>Performed By</label>
        <select id="log-tech">
          <option>Captain Rob</option>
          <option>Other Technician</option>
          <option>Shop / Dealer</option>
        </select>
      </div>
      <div class="field">
        <label>Parts Cost ($)</label>
        <input type="number" id="log-cost" inputmode="decimal" step="0.01" placeholder="0.00">
      </div>
    </div>
    <button class="btn-primary" onclick="saveLog()">Save Service Record</button>
  </div>
</div>

let readings = {}; // {vehicleId: {current, lastOil, lastHyd}}
let logs = [];
let nextLogId = 1;
let currentTab = 'fleet';
let filterType = '';
let fabOpen = false;
let editVehicleId = null;

const STORE = 'fleet_maintenance_v3';
const STORE_LOGS = 'fleet_logs_v3';

async function load() {
  try {
    const r = await window.storage.get(STORE);
    if (r?.value) readings = JSON.parse(r.value);
  } catch(e) { try { const s = localStorage.getItem(STORE); if(s) readings = JSON.parse(s); } catch(e2){} }
  try {
    const r = await window.storage.get(STORE_LOGS);
    if (r?.value) { const d = JSON.parse(r.value); logs = d.logs||[]; nextLogId = d.nextId||1; }
  } catch(e) { try { const s = localStorage.getItem(STORE_LOGS); if(s) { const d=JSON.parse(s); logs=d.logs||[]; nextLogId=d.nextId||1; } } catch(e2){} }
  render();
}

async function saveData() {
  const str = JSON.stringify(readings);
  try { await window.storage.set(STORE, str); } catch(e) { try { localStorage.setItem(STORE, str); } catch(e2){} }
}
async function saveLogs() {
  const str = JSON.stringify({logs, nextId: nextLogId});
  try { await window.storage.set(STORE_LOGS, str); } catch(e) { try { localStorage.setItem(STORE_LOGS, str); } catch(e2){} }
}

// ═══════════════════════════════════════════════════════
// STATUS CALCULATION
// ═══════════════════════════════════════════════════════
function oilStatus(v) {
  const r = readings[v.id];
  if (!r?.current || !r?.lastOil) return 'unknown';
  const used = r.current - r.lastOil;
  const pct = used / v.oilInterval;
  if (pct >= 1) return 'overdue';
  if (pct >= 0.85 || (v.oilInterval - used) <= 50) return 'due';
  return 'ok';
}

function hydStatus(v) {
  if (!v.hydInt) return null;
  const r = readings[v.id];
  if (!r?.current || !r?.lastHyd) return 'unknown';
  const used = r.current - r.lastHyd;
  const pct = used / v.hydInt;
  if (pct >= 1) return 'overdue';
  if (pct >= 0.85 || (v.hydInt - used) <= 50) return 'due';
  return 'ok';
}

function statusBadge(v) {
  const s = oilStatus(v);
  if (s === 'overdue') return '<span class="badge b-over">OIL OVERDUE</span>';
  if (s === 'due') return '<span class="badge b-due">OIL DUE SOON</span>';
  if (s === 'ok') return '<span class="badge b-ok">Oil OK</span>';
  return '<span class="badge b-na">No Reading</span>';
}

function fuelBadge(fuel) {
  if (fuel === 'Diesel') return '<span class="badge b-diesel">Diesel</span>';
  if (fuel === 'Gas (small engine)') return '<span class="badge b-small">Small Engine</span>';
  if (fuel === 'Natural Gas') return '<span class="badge b-natgas">Natural Gas</span>';
  return '<span class="badge b-gas">Gas</span>';
}

function render() {
  renderSummary();
  if (currentTab === 'fleet') renderFleet();
  else if (currentTab === 'schedule') renderSchedule();
  else if (currentTab === 'log') renderLog();
  else if (currentTab === 'parts') renderParts();

  const showSearch = currentTab === 'fleet' || currentTab === 'log';
  document.getElementById('search-bar').style.display = showSearch ? '' : 'none';
  document.getElementById('filter-row').style.display = currentTab === 'fleet' ? '' : 'none';
  document.getElementById('fab').style.display = '';
  document.getElementById('hdr-sub').textContent = `${VEHICLES.length} vehicles • ${logs.length} service records`;
}

function renderSummary() {
  const total = VEHICLES.length;
  const overdue = VEHICLES.filter(v => oilStatus(v) === 'overdue').length;
  const due = VEHICLES.filter(v => oilStatus(v) === 'due').length;
  const ok = VEHICLES.filter(v => oilStatus(v) === 'ok').length;
  document.getElementById('summary').innerHTML = `
    <div class="stat"><div class="v">${total}</div><div class="l">Total</div></div>
    <div class="stat red"><div class="v">${overdue}</div><div class="l">Overdue</div></div>
    <div class="stat amber"><div class="v">${due}</div><div class="l">Due Soon</div></div>
    <div class="stat green"><div class="v">${ok}</div><div class="l">OK</div></div>
    <div class="stat"><div class="v">${logs.length}</div><div class="l">Service Records</div></div>`;
}

function renderFleet() {
  const q = (document.getElementById('search-input')?.value || '').toLowerCase();
  const list = VEHICLES.filter(v => {
    const typeMatch = !filterType || v.type === filterType ||
      (filterType === 'UTV' && v.type === 'UTV') ||
      (filterType === 'ATV' && v.type === 'ATV');
    const searchMatch = !q || [v.name, v.serial, v.engine, v.fuel, v.oilType].join(' ').toLowerCase().includes(q);
    return (filterType ? v.type === filterType : true) && searchMatch;
  });

  const area = document.getElementById('scroll-area');
  if (!list.length) { area.innerHTML = '<div class="empty"><span class="icon">🚛</span><h3>No vehicles match</h3><p>Try a different search or filter.</p></div>'; return; }

  area.innerHTML = list.map(v => {
    const r = readings[v.id] || {};
    const s = oilStatus(v);
    const hs = hydStatus(v);
    const cur = r.current != null ? r.current.toLocaleString() : '—';
    const lastOil = r.lastOil != null ? r.lastOil.toLocaleString() : '—';
    const nextOil = (r.lastOil != null) ? (r.lastOil + v.oilInterval).toLocaleString() : '—';
    return `<div class="vcard" onclick="openDetail(${v.id})">
      <div class="vcard-top">
        <div><div class="vcard-name">${v.name}</div><div class="vcard-serial">${v.serial}</div></div>
        <div class="vcard-badges">${fuelBadge(v.fuel)}${statusBadge(v)}</div>
      </div>
      <div class="vcard-grid">
        <div class="vf"><label>Oil Type</label><span>${v.oilType}</span></div>
        <div class="vf"><label>Oil Filter</label><span>${v.oilFilter}</span></div>
        <div class="vf"><label>Oil Qty</label><span>${v.oilQty} qts</span></div>
        <div class="vf"><label>Oil Interval</label><span>Every ${v.oilInterval.toLocaleString()} hrs/mi</span></div>
        <div class="vf"><label>Current Hrs/Mi</label><span>${cur}</span></div>
        <div class="vf"><label>Next Oil Due At</label><span>${nextOil}</span></div>
      </div>
      <div class="vcard-hr"></div>
      <div class="vcard-actions">
        <button class="va-btn primary" onclick="event.stopPropagation();openHrsSheet(${v.id})">📊 Update Hrs</button>
        <button class="va-btn" onclick="event.stopPropagation();openLogSheetFor(${v.id})">🔧 Log Service</button>
        <button class="va-btn" onclick="event.stopPropagation();openDetail(${v.id})">📋 Full Specs</button>
      </div>
    </div>`;
  }).join('');
}

function renderSchedule() {
  const sorted = [...VEHICLES].sort((a,b) => {
    const order = {overdue:0,due:1,ok:2,unknown:3};
    return (order[oilStatus(a)]||3) - (order[oilStatus(b)]||3);
  });
  const area = document.getElementById('scroll-area');
  area.innerHTML = sorted.map(v => {
    const r = readings[v.id] || {};
    const s = oilStatus(v);
    const hs = hydStatus(v);
    const cur = r.current != null ? r.current : null;
    const used = (cur != null && r.lastOil != null) ? cur - r.lastOil : null;
    const pct = used != null ? Math.min(100, Math.round(used/v.oilInterval*100)) : 0;
    const barColor = s === 'overdue' ? '#C00000' : s === 'due' ? '#E07B00' : '#215732';
    const remaining = (cur != null && r.lastOil != null) ? (v.oilInterval - used) : null;
    const bgClass = s === 'overdue' ? 'background:#FFF0F0;border-color:#C00000' : s === 'due' ? 'background:#FFF8EE;border-color:#E07B00' : '';
    return `<div class="vcard" style="${bgClass}" onclick="openHrsSheet(${v.id})">
      <div class="vcard-top">
        <div><div class="vcard-name">${v.name}</div></div>
        <div class="vcard-badges">${statusBadge(v)}</div>
      </div>
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:${barColor}"></div></div>
      <div class="vcard-grid">
        <div class="vf"><label>Interval</label><span>Every ${v.oilInterval.toLocaleString()}</span></div>
        <div class="vf"><label>Last Change</label><span>${r.lastOil != null ? r.lastOil.toLocaleString() : '—'}</span></div>
        <div class="vf"><label>Current</label><span>${cur != null ? cur.toLocaleString() : 'Tap to enter'}</span></div>
        <div class="vf"><label>${s === 'overdue' ? '⚠ Overdue By' : 'Remaining'}</label>
          <span style="color:${barColor};font-weight:700">${remaining != null ? Math.abs(remaining).toLocaleString() : '—'}</span></div>
      </div>
      ${v.hydInt ? `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:11px;color:var(--text2)">
        Hydraulic: ${hs === 'overdue' ? '<span style="color:var(--red);font-weight:700">OVERDUE</span>' : hs === 'due' ? '<span style="color:var(--amber);font-weight:700">Due Soon</span>' : hs === 'ok' ? '<span style="color:var(--green)">OK</span>' : 'No reading'} — Interval: every ${v.hydInt} hrs
      </div>` : ''}
    </div>`;
  }).join('');
}

function renderLog() {
  const q = (document.getElementById('search-input')?.value || '').toLowerCase();
  const area = document.getElementById('scroll-area');
  const sorted = [...logs].sort((a,b) => new Date(b.date) - new Date(a.date));

  if (!filtered.length) { area.innerHTML = '<div class="empty"><span class="icon">📋</span><h3>No service records yet</h3><p>Tap "+ Log Service" to add your first record.</p></div>'; return; }
  area.innerHTML = filtered.map(l => `
    <div class="log-card">
      <div class="log-card-top">

        <div style="display:flex;gap:6px;align-items:center">

function setTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  if (document.getElementById('search-input')) document.getElementById('search-input').value = '';

}

function setFilter(type, el) {
  filterType = type;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  render();
}

// HOURS SHEET
// ═══════════════════════════════════════════════════════
let hrsVehicleId = null;
function openHrsSheet(id) {
  hrsVehicleId = id;
  const v = VEHICLES.find(x => x.id === id);
  const r = readings[id] || {};
  document.getElementById('hrs-title').textContent = `Update: ${v.name}`;
  document.getElementById('hrs-input').value = r.current || '';
  document.getElementById('last-oil-input').value = r.lastOil || '';
  document.getElementById('last-hyd-input').value = r.lastHyd || '';
  openSheet('hrs-sheet');
}
function saveHours() {
  if (!hrsVehicleId) return;
  const cur = parseFloat(document.getElementById('hrs-input').value);
  const lastOil = parseFloat(document.getElementById('last-oil-input').value);
  const lastHyd = parseFloat(document.getElementById('last-hyd-input').value);
  if (!readings[hrsVehicleId]) readings[hrsVehicleId] = {};
  if (!isNaN(cur)) readings[hrsVehicleId].current = cur;
  if (!isNaN(lastOil)) readings[hrsVehicleId].lastOil = lastOil;
  if (!isNaN(lastHyd)) readings[hrsVehicleId].lastHyd = lastHyd;
  saveData(); closeSheets(); render(); toast('Readings updated!');
}

// ═══════════════════════════════════════════════════════
// LOG SHEET
// ═══════════════════════════════════════════════════════
function openLogSheet() {
  populateVehicleSelect(null);
  document.getElementById('log-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('log-hrs').value = '';
  document.getElementById('log-parts').value = '';
  document.getElementById('log-notes').value = '';
  document.getElementById('log-cost').value = '';
  openSheet('log-sheet');
}
function openLogSheetFor(id) {
  populateVehicleSelect(id);
  const r = readings[id] || {};
  document.getElementById('log-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('log-hrs').value = r.current || '';
  document.getElementById('log-parts').value = '';
  document.getElementById('log-notes').value = '';
  document.getElementById('log-cost').value = '';
  openSheet('log-sheet');
}
function populateVehicleSelect(selectedId) {
  const sel = document.getElementById('log-vehicle');
  sel.innerHTML = VEHICLES.map(v => `<option value="${v.id}" ${v.id === selectedId ? 'selected' : ''}>${v.name}</option>`).join('');
}
function saveLog() {
  const vehicleId = parseInt(document.getElementById('log-vehicle').value);
  const v = VEHICLES.find(x => x.id === vehicleId);
  const date = document.getElementById('log-date').value;
  const type = document.getElementById('log-type').value;
  if (!date || !type) { toast('Please fill in date and service type'); return; }
  const hrs = parseFloat(document.getElementById('log-hrs').value);
  const entry = {
    id: nextLogId++,
    vehicle: v.name,
    vehicleId,
    date,
    type,
    hrs: !isNaN(hrs) ? hrs : null,
    parts: document.getElementById('log-parts').value.trim(),
    notes: document.getElementById('log-notes').value.trim(),
    tech: document.getElementById('log-tech').value,
    cost: document.getElementById('log-cost').value,
  };
  logs.push(entry);
  // Auto-update readings if oil change
  if (type === 'Oil Change' && !isNaN(hrs)) {
    if (!readings[vehicleId]) readings[vehicleId] = {};
    readings[vehicleId].lastOil = hrs;
    if (!readings[vehicleId].current || hrs > readings[vehicleId].current) readings[vehicleId].current = hrs;
    saveData();
  }
  if ((type === 'Hydraulic Fluid Change') && !isNaN(hrs)) {
    if (!readings[vehicleId]) readings[vehicleId] = {};
    readings[vehicleId].lastHyd = hrs;
    saveData();
  }
  saveLogs(); closeSheets(); render(); toast('Service record saved!');
}
function deleteLog(id) {
  if (!confirm('Delete this service record?')) return;
  logs = logs.filter(l => l.id !== id);
  saveLogs(); render(); toast('Record deleted');
}

// ═══════════════════════════════════════════════════════
// EXPORT CSV
// ═══════════════════════════════════════════════════════
function exportCSV() {
  // Sheet 1: Inventory
  const invHeaders = ['Vehicle Name','Type','Serial/VIN','Engine','Fuel','Oil Type','Oil Qty (qts)','Oil Filter','Oil Interval (hrs/mi)','Current Hrs/Mi','Last Oil Change','Next Oil Due','Oil Status','Air Filter Outer','Air Filter Inner','Cabin Filter','Spark Plug','Belts','Trans Fluid','Trans Interval','Hyd Fluid','Hyd Filter','Hyd Interval (hrs)','Last Hyd Change','Hyd Status','Front Diff','Rear Diff','Battery','Wipers','Notes'];
  const invRows = VEHICLES.map(v => {
    const r = readings[v.id] || {};
    const s = oilStatus(v);
    const hs = v.hydInt ? (hydStatus(v) || 'N/A') : 'N/A';
    const nextOil = r.lastOil != null ? r.lastOil + v.oilInterval : '';
    return [
      v.name, v.type, v.serial, v.engine, v.fuel,
      v.oilType, v.oilQty, v.oilFilter, v.oilInterval,
      r.current ?? '', r.lastOil ?? '', nextOil,
      s === 'overdue' ? 'OVERDUE' : s === 'due' ? 'DUE SOON' : s === 'ok' ? 'OK' : 'No Reading',
      v.airOuter, v.airInner, v.cabinFilter, v.sparkPlug, v.belts,
      v.transFl, v.transInt || 'N/A',
      v.hydFl, v.hydFilter, v.hydInt || 'N/A', r.lastHyd ?? '', hs,
      v.frontDiff, v.rearDiff, v.battery, v.wipers,
      (v.notes || '').replace(/,/g,';').replace(/\n/g,' ')
    ];
  });

  // Sheet 2: Service Log
  const logHeaders = ['Date','Vehicle','Service Type','Hrs/Mileage','Parts Used','Notes','Performed By','Parts Cost ($)'];
  const logRows = [...logs].sort((a,b) => new Date(b.date)-new Date(a.date)).map(l => [
    l.date, l.vehicle, l.type, l.hrs ?? '', 
    (l.parts||'').replace(/,/g,';'), (l.notes||'').replace(/,/g,';').replace(/\n/g,' '),
    l.tech, l.cost || ''
  ]);

  // Parts List
  const partsHeaders = ['Category','Part Description','Part Number(s)','Qty','Applies To','Notes'];
  const partsRows = PARTS_LIST.map(p => [p.cat, p.part, '', p.qty, p.applies, p.note]);

  function toCSV(headers, rows) {
    return [headers, ...rows].map(row =>
      row.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')
    ).join('\n');
  }

  const csv1 = toCSV(invHeaders, invRows);
  const csv2 = toCSV(logHeaders, logRows);
  const csv3 = toCSV(partsHeaders, partsRows);
  const full = `FLEET INVENTORY\n${csv1}\n\n\nSERVICE LOG\n${csv2}\n\n\nPARTS SHOPPING LIST\n${csv3}`;

  const blob = new Blob([full], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `fleet-maintenance-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  toast('CSV exported — open in Excel or Google Sheets!');
}

// ═══════════════════════════════════════════════════════
// SHEETS / FAB
// ═══════════════════════════════════════════════════════
function openSheet(id) {
  document.getElementById('sheet-bg').classList.add('open');
  document.getElementById(id).classList.add('open');
}
function closeSheets() {
  document.getElementById('sheet-bg').classList.remove('open');
  ['detail-sheet','hrs-sheet','log-sheet'].forEach(id => document.getElementById(id).classList.remove('open'));
}
function toggleFab() {
  fabOpen = !fabOpen;
  document.getElementById('fab-main').innerHTML = fabOpen ? '✕' : '+';
  document.getElementById('fab-export-row').style.display = fabOpen ? 'flex' : 'none';
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

document.getElementById('sheet-bg').addEventListener('click', closeSheets);
load();
